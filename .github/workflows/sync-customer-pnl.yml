name: Sync customer PNL
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: customer-pnl-production
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements-sync.txt
          npm ci
          npm install --global firebase-tools@15.15.0
      - name: Validate source and detect changes
        run: |
          python scripts/test_customer_sync.py
          python scripts/sync_customer_pnl.py
          REVISION=$(python -c 'import json; print(json.load(open("public/pnl-sync.json"))["revision"])')
          CODE_REVISION=$(git log -1 --format=%H -- src vite.config.js package-lock.json)
          echo "VITE_BUILD_ID=$CODE_REVISION:$REVISION" >> "$GITHUB_ENV"
      - name: Check and build dashboard
        run: |
          npm run lint
          npm run build
      - name: Authenticate Hosting deployer
        uses: google-github-actions/auth@v3
        with:
          project_id: vn-buk-dashboard
          workload_identity_provider: projects/1038039402368/locations/global/workloadIdentityPools/pnl-github/providers/github
          service_account: pnl-hosting-sync@vn-buk-dashboard.iam.gserviceaccount.com
      - name: Deploy validated snapshot
        run: firebase deploy --only hosting --project vn-buk-dashboard --non-interactive
      - name: Preserve source revision after successful deployment
        run: |
          if ! git diff --quiet -- src/data/ops.json src/data/plan3y.json src/data/pnl_import_quality.json public/pnl-sync.json; then
            git config user.name 'PNL source sync'
            git config user.email 'actions@users.noreply.github.com'
            git add src/data/ops.json src/data/plan3y.json src/data/pnl_import_quality.json public/pnl-sync.json
            git commit -m 'Confirm validated Customer PNL snapshot'
            git push origin HEAD:main
          fi
